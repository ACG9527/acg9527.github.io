<script>
    function updateRunTime() {
        
        var birthDay = new Date("2026/3/01 00:00:00"); 
        
        var now = new Date();
        var duration = now.getTime() - birthDay.getTime();
        var days = Math.floor(duration / (24 * 3600 * 1000));
        var hours = Math.floor((duration % (24 * 3600 * 1000)) / (3600 * 1000));
        var minutes = Math.floor((duration % (3600 * 1000)) / (60 * 1000));
        var seconds = Math.floor((duration % (60 * 1000)) / 1000);
        document.getElementById("blog-run-time").innerHTML = 
            days + " 天 " + hours + " 小时 " + minutes + " 分 " + seconds + " 秒";
    }
    setInterval(updateRunTime, 1000);
</script>
